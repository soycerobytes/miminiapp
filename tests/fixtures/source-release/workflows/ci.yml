name: CI

run-name: >-
  ${{ github.event_name == 'pull_request' && format('I03 CI v1 | repo={0} | id={1} | pr={2} | base={3} | head={4}', github.event.pull_request.base.repo.full_name, github.event.pull_request.base.repo.id, github.event.pull_request.number, github.event.pull_request.base.ref, github.event.pull_request.head.sha) || format('I03 CI push | repo={0} | head={1}', github.repository, github.sha) }}

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: ['feature/i03*']

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_BROWSERS_PATH: /tmp/miminiapp-playwright

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Verify runtime and runner
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(npm --version)" = "11.19.1"
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          printf 'Runner architecture: %s\n' "$RUNNER_ARCH"
      - run: npm ci
      - name: Install the pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify application and release controls
        run: npm run verify
      - name: Keep failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
