name: Production checks

run-name: >-
  Production checks | PR ${{ github.event.pull_request.number || inputs.pr_number }} | ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    branches: [main]
    # Releases change only imported application files and their provenance.
    # They use the explicit dispatch below, without a second approval-gated run.
    paths:
      - '.github/**'
      - 'scripts/promotion/**'
      - 'scripts/release/**'
      - 'scripts/validate-hosting.ts'
      - 'deploy/**'
      - 'docs/production-promotion.md'
      - 'docs/design-docs/index.md'
      - 'docs/exec-plans/active/PR-01-promocion-entre-repositorios.md'
      - 'docs/PLANS.md'
      - 'docs/BOOTSTRAP.md'
      - 'docs/harness-decisions.md'
      - 'tests/helpers/workflow-yaml.ts'
      - 'tests/fixtures/source-release/**'
      - 'tests/remote/**'
      - 'tests/unit/production-*.test.ts'
      - 'tests/unit/release-*.test.ts'
      - 'tests/unit/workflow-safety.test.ts'
      - 'tests/unit/pr-ci-identity.test.ts'
      - 'tests/unit/staging-token-probe.test.ts'
      - 'tests/unit/remote-target.test.ts'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.gitignore'
      - '.gitattributes'
      - '!.github/release-provenance.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact prepared release PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted production controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Verify staging evidence and exact release transfer
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') }}
        run: node control/scripts/promotion/cli.ts check-pr
        env:
          GH_TOKEN: ${{ github.token }}
      # Configuration changes have no equivalent staging validation. Check the
      # production controls themselves, without repeating application tests.
      - name: Check out the production configuration change
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: configuration
          persist-credentials: false
      - name: Install configuration test tools
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}
        run: npm ci
        working-directory: configuration
      - name: Validate production configuration and transfer controls
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}
        run: |
          npm run lint
          npm run format:check
          npm run test:unit -- tests/unit/production-promotion.test.ts tests/unit/production-workflow-safety.test.ts
        working-directory: configuration
